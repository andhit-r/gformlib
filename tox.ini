[tox]
envlist = py39, py310, py311, py312, lint, type
isolated_build = true

[testenv]
deps =
    pytest>=7.4
    pytest-cov>=4.1
    pytest-mock>=3.11
    google-api-python-client>=2.100.0
    google-auth>=2.23.0
    google-auth-oauthlib>=1.1.0
    google-auth-httplib2>=0.2.0
commands =
    pytest --cov=gformlib --cov-report=term-missing {posargs}

[testenv:lint]
skip_install = true
deps =
    black>=23.0
    isort>=5.12
    flake8>=6.1
commands =
    black --check src tests
    isort --check-only src tests
    flake8 src tests

[flake8]
max-line-length = 99
extend-ignore = E203, W503

[testenv:type]
deps =
    mypy>=1.5
    google-api-python-client>=2.100.0
    google-auth>=2.23.0
    google-auth-oauthlib>=1.1.0
    types-google-cloud-ndb
commands =
    mypy src/gformlib
